plugins {
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.aliyun.com/repository/spring' }
    mavenCentral()
}

// 中文源码必须 UTF-8
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 只留一个可执行 jar，避免 build/libs 下有俩 jar 导致 Dockerfile 的 COPY 歧义
tasks.named('jar') { enabled = false }

// 固定产物文件名，让 Dockerfile 里 COPY 的路径稳定、不随版本号变化
bootJar {
    archiveFileName = 'excel-import-service.jar'
    // 便于在服务器上确认镜像内跑的到底是哪次构建
    manifest {
        attributes(
                'Implementation-Title': 'excel-import-service',
                'Implementation-Version': project.version,
                'Build-Time': new Date().format("yyyy-MM-dd HH:mm:ss")
        )
    }
}

// 重点：添加dependencyManagement，导入alibaba bom
dependencyManagement {
    imports {
        mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:2023.0.1.0"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.alibaba:easyexcel:3.3.3'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // nacos discovery，这里不用写版本号，由上面BOM统一管理
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
}
