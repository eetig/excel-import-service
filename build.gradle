plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.aliyun.com/repository/spring' }
    mavenCentral()
}

// 中文源码必须 UTF-8
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 只留一个可执行 jar，避免 build/libs 下有俩 jar 导致 Dockerfile 的 COPY 歧义
tasks.named('jar') { enabled = false }

// 固定产物文件名，让 Dockerfile 里 COPY 的路径稳定、不随版本号变化
bootJar {
    archiveFileName = 'excel-import-service.jar'
    // 便于在服务器上确认镜像内跑的到底是哪次构建
    manifest {
        attributes(
                'Implementation-Title': 'excel-import-service',
                'Implementation-Version': project.version,
                'Build-Time': new Date().format("yyyy-MM-dd HH:mm:ss")
        )
    }
}

dependencyManagement {
    imports {
        // Spring Cloud BOM：此前缺失，导致 spring-cloud-commons / spring-cloud-context
        // 只能由 nacos starter 传递解析出任意版本、完全不受管控。必须显式导入。
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.3"
        // Spring Cloud Alibaba BOM，与上面 Cloud 2025.0.x 配对
        mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:2025.0.0.0"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.alibaba:easyexcel:3.3.3'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // nacos discovery，版本由上面 BOM 统一管理
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'

    // 服务间共享契约（ExcelResult / GoodsMoveExcelDTO / WorkOrderExcelDTO），
    // 由 shared-contract 定义唯一一份，勿在此另行复制
    implementation 'org.example:shared-contract:1.0-SNAPSHOT'
}
